name: Phase 1 checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      LOKY_MAX_CPU_COUNT: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scientific test dependencies
        run: python -m pip install numpy pandas scipy scikit-learn matplotlib PyYAML joblib threadpoolctl
      - name: Run protocol and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check committed submission artifacts
        run: python scripts/verify_submission.py
      - name: Check whitespace
        run: git diff --check
