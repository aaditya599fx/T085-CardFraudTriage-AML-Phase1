name: Phase 2 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      LOKY_MAX_CPU_COUNT: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Phase 2 check dependencies
        run: python -m pip install -r requirements.txt
      - name: Test the study and committed evidence
        run: python -m unittest discover -s phase2/tests -v
      - name: Execute Phase 2 notebooks from the committed study outputs
        run: jupyter nbconvert --to notebook --execute notebooks/phase2/*.ipynb --output-dir /tmp/phase2-notebook
